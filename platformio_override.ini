; ***  PlatformIO Project Configuration Override File   ***
; ***  Webradio Mini - ESP32-S3 Super Mini (4MB), audio-only build  ***
;
; This override adds a single environment: the compact webradio streamer.
; No LVGL / no display / no touch (those overflow the 4MB Super Mini).
;
; It does NOT redefine [env:tasmota32_base] - that base env is provided by
; Tasmota (platformio_tasmota_env32.ini) and carries the platform, core build
; flags, scripts, etc. We only extend it and override the board.

[platformio]
; The environment actually built. Must match the [env:...] section below and
; the default_envs in platformio.ini.
default_envs            = tasmota32s3-webradio-mini


; -----------------------------------------------------------------------------
; Webradio Mini environment
; -----------------------------------------------------------------------------
[env:tasmota32s3-webradio-mini]
extends                = env:tasmota32_base
; ESP32-S3, 4MB flash QIO, QSPI PSRAM. Partition: 2880k app/OTA + 320k FS.
board                  = esp32s3-qio_qspi

; Audio feature flags (USE_I2S_*) come from user_config_override.h, enabled
; globally via -DUSE_CONFIG_OVERRIDE. We keep the base flags and add nothing
; display/LVGL/touch related.
build_flags            = ${env:tasmota32_base.build_flags}

; Drop LVGL from the lib dirs inherited from tasmota32_base to cut code size and
; compile time (this build has no LVGL). Re-list the base dirs minus libesp32_lvgl.
lib_extra_dirs         = ${common.lib_extra_dirs}
                         lib/libesp32