; ***  PlatformIO Project Configuration Override File   ***
; ***  Webradio LVGL - Waveshare ESP32-S3-Touch-LCD-2 (8MB, PSRAM OPI)  ***
;
; This override adds a single environment: the webradio streamer WITH display.
; LVGL + OpenHASP + Universal Display/Touch, on top of the webradio audio stack.
;
; It does NOT redefine [env:tasmota32_base] - that base env is provided by
; Tasmota (platformio_tasmota_env32.ini). We only extend it and override the
; board, partitions, build flags and lib dirs.

[platformio]
default_envs            = tasmota32s3-webradio-lvgl

[env:tasmota32s3-webradio-lvgl]
extends                = env:tasmota32_base
board                  = esp32s3-qio_opi_120
board_build.partitions = partitions/esp32_partition_app3904k_fs3392k.csv

build_flags            = ${env:tasmota32_base.build_flags}
                         -DFIRMWARE_LVGL
                         -DUSE_LVGL
                         -DUSE_LVGL_OPENHASP
                         -DUSE_DISPLAY
                         -DUSE_UNIVERSAL_DISPLAY
                         -DUSE_UNIVERSAL_TOUCH
                         -DUSE_SPI
                         -DUSE_I2C

lib_extra_dirs         = ${common.lib_extra_dirs}
                         lib/libesp32
                         lib/libesp32_lvgl
